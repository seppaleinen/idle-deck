name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Install dependencies
        run: go mod download
      - name: Run D-id checker
        run: |
          grep -oh 'D[0-9]\+' --exclude-dir=.git -r . | sort -u > /tmp/cited
          grep -rho '^\| \*\*D[0-9]\+\*\*' --include=AGENTS.md . | grep -o 'D[0-9]\+' | sort -u > /tmp/defined
          comm -23 /tmp/cited /tmp/defined
          # If the command exits non-zero CI will fail – guard from stale D-ids.
      - name: TierRank single-source lint
        run: scripts/check-tierrank-single-source.sh
      - name: Build all packages
        run: |
          # CGO_ENABLED=0 is asserted, not inherited: a dependency that
          # reintroduces cgo would silently break go install for users, so
          # the build gate must not depend on the environment being clean
          # (ADR 0017).
          CGO_ENABLED=0 go build ./...
          CGO_ENABLED=0 go build -o /tmp/idle-deck-ci .
          test "$(CGO_ENABLED=0 go env CGO_ENABLED)" = "0"
      - name: Vet packages
        run: go vet ./...
      - name: Test packages
        run: go test ./...
      - name: Smoke test
        run: |
          go run . --version
          # v0.1.0: the tagged release version (gate 4 of #24)
          go run . --version | grep -q "idle-deck v0.1.0" || { echo "FAIL: expected v0.1.0"; exit 1; }
          go run . check && { echo "FAIL: check should fail without config"; exit 1; } || echo "check refused without config (expected)"
          go run . run 2>/dev/null || echo "run refused as expected"

  # Docker image (Phase 1 of the Docker+Helm plan). Builds the multi-arch
  # image and pushes it to GHCR on every push to main and on every tag.
  # Multi-arch (linux/amd64 + linux/arm64) because k3s on Apple Silicon
  # and Pi is common; cache-from/to GHA to keep the build fast.
  docker:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tags=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
            echo "latest=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> $GITHUB_OUTPUT
          else
            echo "tags=ghcr.io/${GITHUB_REPOSITORY,,}:main-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.tags }}${{ steps.tag.outputs.latest && format(',{0}', steps.tag.outputs.latest) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max